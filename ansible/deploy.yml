---
- name: Deploy and validate Resilience Alpha
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir }}/.."
    required_services:
      - postgres
      - auth
      - payment-api
      - waf
      - prometheus
      - grafana
      - loki
      - aiops-detector
      - dashboard

  tasks:
    - name: Check the Docker CLI
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Check that the local environment file exists
      ansible.builtin.stat:
        path: "{{ project_root }}/.env"
      register: local_env

    - name: Require a local environment file
      ansible.builtin.assert:
        that:
          - local_env.stat.exists
          - local_env.stat.isreg
        fail_msg: "Create .env from .env.example before deployment."

    - name: Validate the Compose configuration without printing secrets
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - .env
          - config
          - --quiet
        chdir: "{{ project_root }}"
      changed_when: false

    - name: Build the project service images
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - .env
          - build
        chdir: "{{ project_root }}"
      changed_when: false

    - name: Apply the Compose desired state and wait for health checks
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - .env
          - up
          - --detach
          - --wait
          - --wait-timeout
          - "120"
        chdir: "{{ project_root }}"
      register: compose_deploy
      changed_when: (compose_deploy.stdout + compose_deploy.stderr) is search("Created|Recreated|Started")

    - name: Collect running Compose services
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - .env
          - ps
          - --services
          - --filter
          - status=running
        chdir: "{{ project_root }}"
      register: running_services
      changed_when: false

    - name: Require every core service to be running
      ansible.builtin.assert:
        that:
          - item in running_services.stdout_lines
        fail_msg: "Required service {{ item }} is not running."
      loop: "{{ required_services }}"

    - name: Verify application and observability endpoints
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - resilience-payment-api
          - python
          - -c
          - >-
            import json, urllib.request;
            urls = [
              'http://localhost:8000/health',
              'http://auth:8001/health',
              'http://waf:8080/health',
              'http://dashboard/',
              'http://prometheus:9090/-/healthy',
              'http://grafana:3000/api/health',
              'http://loki:3100/ready'
            ];
            [urllib.request.urlopen(url, timeout=5).read() for url in urls];
            health = json.loads(urllib.request.urlopen(urls[0], timeout=5).read());
            assert health.get('status') == 'ok', health;
            targets = json.loads(urllib.request.urlopen('http://prometheus:9090/api/v1/targets?state=active', timeout=5).read());
            api_up = any(target.get('labels', {}).get('job') == 'payment-api' and target.get('health') == 'up' for target in targets['data']['activeTargets']);
            assert api_up, 'Prometheus is not scraping payment-api successfully';
            grafana = json.loads(urllib.request.urlopen(urls[5], timeout=5).read());
            assert grafana.get('database') == 'ok', grafana
      register: endpoint_check
      changed_when: false
      retries: 6
      delay: 5
      until: endpoint_check.rc == 0

    - name: Report deployment verification
      ansible.builtin.debug:
        msg: >-
          Compose desired state is running; core service endpoints and the API
          database health check passed. Business recovery still requires the
          authorized scenario documented in docs/testing-and-demo.md.
