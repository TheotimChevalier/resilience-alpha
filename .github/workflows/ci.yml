name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
            aiops/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install -r api/requirements.txt -r api/requirements-dev.txt
          python -m pip install -r aiops/requirements.txt

      - name: Run API and AIOps tests
        run: python -m pytest api/tests aiops/test_detector.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Verify source archive excludes local secrets
        run: python scripts/package_release.py --team 0 --output "$RUNNER_TEMP/resilience-alpha-code.zip"
