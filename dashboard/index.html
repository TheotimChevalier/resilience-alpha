
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PROJECT RESILIENCE-ALPHA - Supervision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [status, setStatus] = useState("Vérification...");
      const [isHealthy, setIsHealthy] = useState(true);
      const [logs, setLogs] = useState([]);
      const [amount, setAmount] = useState(25.0);
      const [security, setSecurity] = useState({ guard: "checking", ollama: "checking", model: "llama3.2:latest" });
      const [securityEvents, setSecurityEvents] = useState([]);
      const [isSimulating, setIsSimulating] = useState(false);

      const addLog = (msg) => {
        setLogs((prev) => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev.slice(0, 15)]);
      };

      const checkHealth = async () => {
        try {
          const response = await fetch("http://localhost:8000/health");
          if (response.ok) {
            setStatus("OPÉRATIONNEL (Nominal)");
            setIsHealthy(true);
          } else {
            setStatus("DÉGRADÉ (503 Service Unavailable)");
            setIsHealthy(false);
          }
        } catch (e) {
          setStatus("INDISPONIBLE");
          setIsHealthy(false);
        }
      };

      useEffect(() => {
        const interval = setInterval(checkHealth, 3000);
        return () => clearInterval(interval);
      }, []);

      const refreshSecurity = async () => {
        try {
          const [statusResponse, eventsResponse] = await Promise.all([
            fetch("http://localhost:8000/security/status"),
            fetch("http://localhost:8000/security/events")
          ]);
          if (!statusResponse.ok || !eventsResponse.ok) throw new Error("Protection indisponible");
          setSecurity(await statusResponse.json());
          setSecurityEvents((await eventsResponse.json()).events);
        } catch (err) {
          setSecurity((current) => ({ ...current, guard: "unavailable", ollama: "unavailable" }));
        }
      };

      useEffect(() => {
        refreshSecurity();
        const interval = setInterval(refreshSecurity, 2000);
        return () => clearInterval(interval);
      }, []);

      const sendPayment = async () => {
        addLog(`Initiation transaction : ${amount} €`);
        try {
          const res = await fetch("http://localhost:8000/api/v1/pay", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: "CLIENT-WEB", amount: parseFloat(amount), destination_account: "ACC-RECV" })
          });
          const data = await res.json();
          if (res.ok) {
            addLog(`✓ Succès : Transaction ${data.transaction_id} validée`);
          } else {
            addLog(`✗ Échec : Erreur ${res.status} (${data.detail || "Panne"})`);
          }
        } catch (err) {
          addLog(`✗ Erreur réseau / API injoignable`);
        }
      };

      const simulateAttack = async () => {
        setIsSimulating(true);
        addLog("Simulation locale : envoi d’un unique signal suspect contrôlé…");
        try {
          const response = await fetch("http://localhost:8000/api/v1/pay", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: "JURY-SIMULATION",
              amount: 9999.99,
              destination_account: "LAB-ONLY"
            })
          });
          const result = await response.json();
          if (response.status === 403) {
            addLog(`🛡️ AI Guard : signal bloqué avant paiement (${result.detail})`);
            await refreshSecurity();
          } else {
            addLog(`Réponse inattendue à la simulation : HTTP ${response.status}`);
          }
        } catch (err) {
          addLog("✗ API inaccessible pendant la simulation.");
        } finally {
          setIsSimulating(false);
        }
      };

      return (
        <div className="p-8 max-w-5xl mx-auto">
          <header className="flex justify-between items-center pb-6 border-b border-slate-700">
            <div>
              <h1 className="text-2xl font-bold tracking-tight text-white">PROJECT RESILIENCE-ALPHA</h1>
              <p className="text-slate-400 text-sm">Supervision & Démonstrateur de Paiement Autonome</p>
            </div>
            <div className={`px-4 py-2 rounded-full font-semibold text-sm ${isHealthy ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500' : 'bg-rose-500/20 text-rose-400 border border-rose-500 animate-pulse'}`}>
              {status}
            </div>
          </header>

          <main className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
            <section className="md:col-span-2 bg-gradient-to-r from-indigo-950 to-slate-800 p-6 rounded-xl border border-indigo-700 shadow-lg">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className={`h-2.5 w-2.5 rounded-full ${security.ollama === "available" ? "bg-emerald-400" : "bg-amber-400"}`}></span>
                    <h2 className="text-lg font-semibold text-white">Protection IA locale · Python + Ollama</h2>
                  </div>
                  <p className="text-sm text-slate-300 mt-2">
                    Garde-fou Python bloque d’abord le signal suspect ; {security.model} l’analyse ensuite en local.
                    {" "}Ollama : {security.ollama === "available" ? "connecté" : security.ollama === "model_missing" ? "modèle absent" : security.ollama === "unavailable" ? "indisponible" : "vérification…"}.
                  </p>
                </div>
                <button
                  onClick={simulateAttack}
                  disabled={isSimulating || security.guard !== "active"}
                  className="bg-rose-700 hover:bg-rose-600 disabled:opacity-50 text-white font-semibold px-5 py-3 rounded-lg transition"
                >
                  {isSimulating ? "Analyse en cours…" : "Simuler un signal d’attaque"}
                </button>
              </div>
              <div className="mt-5 space-y-2">
                {securityEvents.length === 0 ? (
                  <p className="text-xs text-slate-400">En attente d’un événement de sécurité. La simulation n’envoie qu’une requête locale.</p>
                ) : securityEvents.slice(0, 4).map((event) => (
                  <div key={event.id} className="rounded bg-slate-950/70 border border-slate-700 p-3 text-xs">
                    <div className="flex flex-wrap gap-x-3 gap-y-1 items-center">
                      <span className="text-rose-300 font-bold">{event.severity.toUpperCase()}</span>
                      <span className="text-white">{event.category}</span>
                      <span className="text-emerald-300">Ollama recommande : {event.ai_recommendation}</span>
                      <span className="text-slate-200">Python applique : {event.action}</span>
                      <span className="text-slate-400">{event.analysis_status}</span>
                    </div>
                    <p className="text-slate-300 mt-1">{event.explanation}</p>
                  </div>
                ))}
              </div>
            </section>
            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-sm">
              <h2 className="text-lg font-semibold mb-4 text-slate-200">Exécuter une Transaction</h2>
              <div className="space-y-4">
                <div>
                  <label className="block text-xs uppercase text-slate-400 font-bold mb-1">Montant (€)</label>
                  <input 
                    type="number" 
                    value={amount} 
                    onChange={(e) => setAmount(e.target.value)} 
                    className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <button 
                  onClick={sendPayment}
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded transition">
                  Payer maintenant
                </button>
              </div>
            </div>

            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-sm flex flex-col">
              <h2 className="text-lg font-semibold mb-4 text-slate-200">Journal d'Événements</h2>
              <div className="flex-1 bg-slate-950 p-4 rounded border border-slate-900 font-mono text-xs overflow-y-auto max-h-56 space-y-1">
                {logs.length === 0 ? <span className="text-slate-500">Aucune activité enregistrée.</span> : null}
                {logs.map((log, index) => (
                  <div key={index} className={log.includes("✓") ? "text-emerald-400" : log.includes("✗") ? "text-rose-400" : "text-slate-300"}>
                    {log}
                  </div>
                ))}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
